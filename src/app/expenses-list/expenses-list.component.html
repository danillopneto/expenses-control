<mat-card class="expenses-list-card">
  <div *ngIf="loading">Loading expenses...</div>
  <div *ngIf="!loading && expenses.length === 0">No expenses found.</div>
  <table mat-table [dataSource]="expenses" class="mat-elevation-z2" *ngIf="!loading && expenses.length > 0">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let expense">{{ expense.date }}</td>
    </ng-container>
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let expense">{{ expense.description }}</td>
    </ng-container>
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef>Value</th>
      <td mat-cell *matCellDef="let expense">{{ expense.value }}</td>
    </ng-container>
    <ng-container matColumnDef="place">
      <th mat-header-cell *matHeaderCellDef>Place</th>
      <td mat-cell *matCellDef="let expense">{{ expense.place }}</td>
    </ng-container>
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let expense">{{ categoriesMap[expense.category] || expense.category }}</td>
    </ng-container>
    <ng-container matColumnDef="accountUsed">
      <th mat-header-cell *matHeaderCellDef>Account Used</th>
      <td mat-cell *matCellDef="let expense">{{ accountsMap[expense.accountUsed] || expense.accountUsed }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['date', 'description', 'value', 'place', 'category', 'accountUsed']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['date', 'description', 'value', 'place', 'category', 'accountUsed'];"></tr>
  </table>
</mat-card>
