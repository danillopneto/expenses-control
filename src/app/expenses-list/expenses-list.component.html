<mat-card class="expenses-list-card">
  <div *ngIf="loading">{{ 'EXPENSES_LIST.LOADING' | translate }}</div>
  <div *ngIf="!loading && expenses.length === 0">{{ 'EXPENSES_LIST.NO_EXPENSES' | translate }}</div>
  <ag-grid-angular
    *ngIf="!loading && expenses.length > 0"
    class="ag-theme-alpine"
    style="width: 100%; height: 500px;"
    [rowData]="expenses"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [domLayout]="'autoHeight'">
  </ag-grid-angular>
</mat-card>
