<div class="expenses-list-card" style="overflow-x:auto; max-width:100%;">
  <div *ngIf="loading">{{ 'EXPENSES_LIST.LOADING' | translate }}</div>
  <div *ngIf="!loading && expenses.length === 0">{{ 'EXPENSES_LIST.NO_EXPENSES' | translate }}</div>
  <app-expenses-filter
    [categories]="route.snapshot.data['categories'] || []"
    [accounts]="route.snapshot.data['accounts'] || []"
    (filterChange)="onFilterChange($event)"
    style="display:block; margin-bottom: 2rem;">
  </app-expenses-filter>
  <ag-grid-angular
    *ngIf="!loading && expenses.length > 0"
    class="ag-theme-alpine"
    style="width:100%; max-width:100%;"
    [rowData]="expenses"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [domLayout]="'autoHeight'"
    (gridReady)="onGridReady($event)"
    (cellClicked)="onCellClicked($event)">
  </ag-grid-angular>
</div>
