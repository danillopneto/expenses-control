<mat-toolbar color="primary" class="navbar-toolbar">
  <span class="navbar-title">💸 Expenses Control</span>
  <button mat-button [routerLink]="['/dashboard']" routerLinkActive="active">
    <mat-icon>home</mat-icon> Dashboard
  </button>
  <span class="navbar-spacer"></span>
  <ng-container *ngIf="authChecked">
    <ng-container *ngIf="isAuthenticated()">
      <button mat-button [routerLink]="['/expenses']" routerLinkActive="active">
        <mat-icon>add_circle</mat-icon> Add Expense
      </button>
      <button mat-button [routerLink]="['/expenses-list']" routerLinkActive="active">
        <mat-icon>list_alt</mat-icon> Expenses List
      </button>
      <button mat-button [routerLink]="['/settings']" routerLinkActive="active">
        <mat-icon>settings</mat-icon> Settings
      </button>
    </ng-container>
  </ng-container>
</mat-toolbar>
