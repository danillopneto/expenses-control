<mat-toolbar color="primary" class="navbar-toolbar">
  <span class="navbar-title">💸 {{ appTitle }}</span>
  <button mat-icon-button class="navbar-menu-btn" (click)="toggleMenu()" aria-label="Toggle menu">
    <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>
  <div class="navbar-links" [class.open]="menuOpen">
    <ng-container *ngIf="authChecked && isAuthenticated()">
      <button mat-button [routerLink]="['/dashboard']" routerLinkActive="active" (click)="menuOpen = false">
        <mat-icon>home</mat-icon> {{ 'NAV.DASHBOARD' | translate }}
      </button>
    </ng-container>
    <div class="navbar-spacer"></div>
    <div class="navbar-actions" style="display: flex; align-items: center; gap: 0.5rem;">
      <ng-container *ngIf="authChecked && isAuthenticated()">
        <button mat-button [routerLink]="['/expenses']" routerLinkActive="active" (click)="menuOpen = false">
          <mat-icon>add_circle</mat-icon> {{ 'NAV.ADD_EXPENSE' | translate }}
        </button>
        <button mat-button [routerLink]="['/expenses-list']" routerLinkActive="active" (click)="menuOpen = false">
          <mat-icon>list_alt</mat-icon> {{ 'NAV.EXPENSES_LIST' | translate }}
        </button>
        <!-- Settings icon with divider -->
        <span class="navbar-divider" style="border-left:1px solid #ccc; height:24px; margin:0 8px;"></span>
        <button mat-icon-button [routerLink]="['/settings']" routerLinkActive="active" (click)="menuOpen = false" aria-label="Settings">
          <mat-icon>settings</mat-icon>
        </button>
        <!-- User menu -->
        <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item disabled style="opacity:1; font-weight:600;">
            {{ auth.currentUser?.displayName || auth.currentUser?.email }}
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item color="warn" (click)="logout()">
            <mat-icon>logout</mat-icon> Logout
          </button>
        </mat-menu>
      </ng-container>
      <!-- Language selector remains -->
      <mat-menu #langMenu="matMenu">
        <button mat-menu-item *ngFor="let lang of languages" (click)="changeLang(lang.code)">
          <img [src]="lang.code === 'en' ? 'assets/flags/us.svg' : 'assets/flags/br.svg'" width="24" height="16" style="vertical-align:middle;"> <span style="margin-left: 8px">{{ lang.label }}</span>
        </button>
      </mat-menu>
      <button mat-icon-button [matMenuTriggerFor]="langMenu" aria-label="Language selector">
        <img *ngIf="selectedLang === 'en'" src="assets/flags/us.svg" width="24" height="16" style="vertical-align:middle;">
        <img *ngIf="selectedLang === 'pt'" src="assets/flags/br.svg" width="24" height="16" style="vertical-align:middle;">
      </button>
    </div>
  </div>
</mat-toolbar>
