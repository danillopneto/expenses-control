<div class="dashboard-welcome">
  <h2 *ngIf="user">
    {{
      "DASHBOARD.WELCOME" | translate : { name: user.displayName || user.email }
    }}
  </h2>
</div>
<app-expenses-filter
  [categories]="categories"
  [accounts]="accounts"
  [initialDateFrom]="initialDateFrom"
  [initialDateTo]="initialDateTo"
  [expanded]="true"
  (filterChange)="onFilterChange($event)"
  style="margin-bottom: 2rem; display: block"
></app-expenses-filter>
<mat-expansion-panel [(expanded)]="monthlySummaryExpanded">
  <mat-expansion-panel-header class="dashboard-summary-header">
    <span class="dashboard-summary-title">{{
      "DASHBOARD.SUMMARY" | translate
    }}</span>
  </mat-expansion-panel-header>
  <div *ngIf="monthlySummaryExpanded && expenses && accounts && categories">
    <app-dashboard-summary-header
      [expenses]="expenses"
      [accounts]="accounts"
      [categories]="categories"
      [lang]="lang"
    ></app-dashboard-summary-header>
    <app-dashboard-summary
      [expenses]="expenses"
      [accounts]="accounts"
      [categories]="categories"
    ></app-dashboard-summary>
  </div>
</mat-expansion-panel>
