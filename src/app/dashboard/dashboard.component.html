<div class="dashboard-welcome">
  <h2 *ngIf="user">
    {{
      "DASHBOARD.WELCOME" | translate : { name: user.displayName || user.email }
    }}
  </h2>
</div>
<app-expenses-filter
  [categories]="categories"
  [accounts]="accounts"
  [initialDateFrom]="initialDateFrom"
  [initialDateTo]="initialDateTo"
  [expanded]="true"
  (filterChange)="onFilterChange($event)"
  style="margin-bottom: 2rem; display: block"
></app-expenses-filter>
<mat-expansion-panel [(expanded)]="monthlySummaryExpanded">
  <mat-expansion-panel-header class="dashboard-summary-header">
    <span class="dashboard-summary-title">{{
      "DASHBOARD.SUMMARY" | translate
    }}</span>
  </mat-expansion-panel-header>
  <div
    *ngIf="
      monthlySummaryExpanded &&
      expenses &&
      expenses.length &&
      accounts &&
      categories
    ; else noExpensesBlock"
  >
    <app-dashboard-summary-header
      [expenses]="expenses"
      [accounts]="accounts"
      [categories]="categories"
      [lang]="lang"
    ></app-dashboard-summary-header>
    <app-dashboard-summary
      [expenses]="expenses"
      [accounts]="accounts"
      [categories]="categories"
    ></app-dashboard-summary>
  </div>
  <ng-template #noExpensesBlock>
    <div class="no-expenses-message">
      <span style="font-size:2rem; color:#888; display:block; margin:2rem 0; text-align:center; font-weight:500;">
        {{ 'DASHBOARD.NO_EXPENSES' | translate }}
      </span>
    </div>
  </ng-template>
</mat-expansion-panel>
