<div class="dashboard-card">
  <h2 *ngIf="user">{{ 'DASHBOARD.WELCOME' | translate:{ name: (user.displayName || user.email) } }}</h2>

  <!-- Sample Doughnut Chart -->
  <div style="display: block; max-width: 400px; margin: 2rem auto;">
    <canvas baseChart
      [data]="doughnutChartData"
      [labels]="doughnutChartLabels"
      [type]="doughnutChartType"
      [options]="doughnutChartOptions">
    </canvas>
  </div>
</div>
