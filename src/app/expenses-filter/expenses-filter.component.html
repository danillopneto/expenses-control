<mat-accordion>
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        Filters
      </mat-panel-title>
    </mat-expansion-panel-header>
    <form [formGroup]="filterForm" class="filter-form" (ngSubmit)="onSearch()">
      <div class="filter-row">
        <mat-form-field appearance="outline">
          <mat-label>Date From</mat-label>
          <input matInput type="date" formControlName="dateFrom">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Date To</mat-label>
          <input matInput type="date" formControlName="dateTo">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <input matInput type="text" formControlName="description" placeholder="Contains...">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Place</mat-label>
          <input matInput type="text" formControlName="place">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Category</mat-label>
          <mat-select formControlName="category">
            <mat-option value="">All</mat-option>
            <mat-option *ngFor="let cat of categories" [value]="cat.id">{{cat.name}}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Account Used</mat-label>
          <mat-select formControlName="accountUsed">
            <mat-option value="">All</mat-option>
            <mat-option *ngFor="let acc of accounts" [value]="acc.id">{{acc.name}}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="filter-actions">
        <button mat-stroked-button color="primary" type="submit">
          <mat-icon>search</mat-icon> Search
        </button>
        <button mat-stroked-button color="warn" type="button" (click)="reset()">
          <mat-icon>refresh</mat-icon> Reset
        </button>
      </div>
    </form>
  </mat-expansion-panel>
</mat-accordion>
